[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-lotes"
version = "0.1.0"
description = "Monitor de lotes agrícolas con NDVI de Sentinel-2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "xarray>=2024.6",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "pystac-client>=0.8",
    "odc-stac>=0.4",
    "planetary-computer>=1.0",
    "streamlit>=1.50",
    "streamlit-folium>=0.25",
    "folium>=0.18",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
monitor-lotes = "monitor_lotes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monitor_lotes = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# app.py importa el paquete después de revisar si hay que recargarlo (ver recargar_paquete_si_cambio)
"app.py" = ["E402", "I001"]
