name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias (las mismas que la demo online)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formato (ruff format)
        run: ruff format --check .

      - name: Tests (sin internet, con datos inventados y el lote de ejemplo)
        run: pytest
